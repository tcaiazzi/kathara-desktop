name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: all
        options:
          - all
          - linux
          - mac
          - windows

jobs:
  linux:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir services/desktop/vendor .
      - run: node scripts/fetch-python.mjs linux
        working-directory: services/desktop
      - run: npm ci
        working-directory: services/frontend
      - run: npm ci
        working-directory: services/desktop
      - run: npm run dist:linux
        working-directory: services/desktop
      - uses: actions/upload-artifact@v7
        with:
          path: |
            services/desktop/release/*.AppImage
            !services/desktop/release/*-arm64.AppImage
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: services/desktop/release/*-arm64.AppImage
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: services/desktop/release/*_amd64.deb
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: services/desktop/release/*_arm64.deb
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: services/desktop/release/*.x86_64.rpm
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: services/desktop/release/*.aarch64.rpm
          archive: false

  mac:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'mac' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir services/desktop/vendor .
      - run: node scripts/fetch-python.mjs mac
        working-directory: services/desktop
      - run: npm ci
        working-directory: services/frontend
      - run: npm ci
        working-directory: services/desktop
      - run: npm run dist:mac
        working-directory: services/desktop
      - uses: actions/upload-artifact@v7
        with:
          path: |
            services/desktop/release/*.dmg
            !services/desktop/release/*-arm64.dmg
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: services/desktop/release/*-arm64.dmg
          archive: false

  windows:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir services/desktop/vendor .
      - run: node scripts/fetch-python.mjs win
        working-directory: services/desktop
      - run: npm ci
        working-directory: services/frontend
      - run: npm ci
        working-directory: services/desktop
      # electron-builder 26's 7-Zip applies the ARM64 branch filter to arm64 executables, and the
      # nsis7z extractor bundled in the installer can't decode it: every filtered file (the app
      # exe, every DLL, python.exe) is dropped silently at install time on Windows on ARM, leaving
      # an installed app with no executable. BCJ2 is what electron-builder 25 produced.
      - run: npm run dist:win
        working-directory: services/desktop
        env:
          ELECTRON_BUILDER_7Z_FILTER: BCJ2
      - uses: actions/upload-artifact@v7
        with:
          path: |
            services/desktop/release/*.exe
            !services/desktop/release/*-arm64.exe
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: services/desktop/release/*-arm64.exe
          archive: false
