name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: services/frontend
      - run: npm run lint
        working-directory: services/frontend
      - run: npm run typecheck
        working-directory: services/frontend
      # `shell: bash` runs with `-eo pipefail`, so a failing test still fails the step through `tee`.
      - run: npm run test:coverage | tee coverage.txt
        shell: bash
        working-directory: services/frontend
      # Report only, no threshold: the per-file table lands on the run's summary page.
      - run: |
          { echo '### Frontend coverage'; echo '```text'; grep -E '^\s*[-A-Za-z0-9_./ ]+\|' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        working-directory: services/frontend
      - run: npm run build
        working-directory: services/frontend

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: services/desktop
      - run: npm run typecheck
        working-directory: services/desktop
      - run: npm run build
        working-directory: services/desktop

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -m "not docker and not network" --cov
      # Report only, no threshold: the per-file table lands on the run's summary page.
      - run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
