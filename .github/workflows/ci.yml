name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: services/frontend
      - run: npm run lint
        working-directory: services/frontend
      - run: npm run typecheck
        working-directory: services/frontend
      - run: npm run build
        working-directory: services/frontend

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: services/desktop
      - run: npm run build
        working-directory: services/desktop

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -m "not docker and not network"
