[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kathara-api-rest"
dynamic = ["version"]
description = "REST API for the Kathara network emulation framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
authors = [{ name = "Kathara Framework" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sse-starlette>=2.0",
    "kathara>=3.8.3",
    "python-multipart>=0.0.9",
    # Imported directly by this package (routers/exec.py, services/kathara_service.py). Both also
    # arrive as transitive dependencies of `kathara`, but a direct import deserves a direct
    # declaration — otherwise an upstream that drops either one breaks this package silently.
    "chardet>=5.0",
    "fs>=2.4",
    # Fetches the upstream lab gallery (services/lab_gallery.py) at runtime, not just in tests —
    # promoted out of the dev extra below for that reason.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "ruff>=0.14"]
# `make mutation-backend` only. Pinned: mutmut 3 has changed its configuration keys between minor
# releases, and [tool.mutmut] below is written for this one.
mutation = ["mutmut==3.8.0"]

[project.scripts]
kathara-api = "kathara_api.main:run"

[project.urls]
Homepage = "https://www.kathara.org"
"Bug Reports" = "https://github.com/KatharaFramework/kathara-desktop/issues"
Source = "https://github.com/KatharaFramework/kathara-desktop"

# Ships the GPL text in the built wheel and sdist. Declared here rather than as [project]
# license-files, which would need setuptools>=77 instead of the >=68 required above.
[tool.setuptools]
license-files = ["LICENSE"]

# Single source of truth for the version: src/kathara_api/__init__.py's __version__, which is
# also what `GET /api/system` and the OpenAPI docs report (main.py imports it). Restated here as
# a literal, it silently drifted from the shipped app's version instead.
[tool.setuptools.dynamic]
version = { attr = "kathara_api.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
# examples/ under kathara_api is data-only (no __init__.py): the default `namespaces = true`
# would discover it as a PEP 420 namespace package and make its data-file ownership ambiguous.
# Every real package here already has an __init__.py, so this is a no-op for the rest of the tree.
namespaces = false

[tool.setuptools.package-data]
# Bundled example network scenarios (src/kathara_api/examples/) — see services/examples.py.
# Ships in every build (wheel, sdist, editable install) with no extra packaging step.
kathara_api = ["examples/**/*"]

# Deliberately narrow. Type errors and unused locals are not the failure mode this codebase has —
# `--select F` reports nothing across it today — so this is a ratchet rather than a cleanup: it
# costs nothing while the code stays clean and catches the dead import a refactor leaves behind.
#
# Everything else stays off on purpose. `UP045`/`UP007` would rewrite ~170 `Optional[X]`
# annotations into `X | None`, against the spelling this codebase already uses consistently, and
# `B008` flags every `Depends(...)` in a FastAPI signature. Formatting is not enforced at all:
# `ruff format` would reflow half the backend for no defect.
[tool.ruff]
# Matches the width the code is already hand-wrapped to, so import sorting does not rewrap
# anything that fits today.
line-length = 110

[tool.ruff.lint]
select = ["F", "I"]

[tool.pytest.ini_options]
markers = [
    "docker: integration tests that require a running Docker daemon",
    "network: integration tests that require internet access (live gallery fetch)",
]
testpaths = ["tests"]

# Read by `make coverage` and by CI's backend job, which report the number without enforcing a
# threshold. Not wired into `addopts`, so a plain `pytest` run stays as fast as it is.
[tool.coverage.run]
source = ["kathara_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# Read by `make mutation-backend`, never by CI. A chosen subset, not every module: the ones where
# most of the backend's own decisions live. A module missing from the list is simply not mutated —
# add it here to run it. schemas/, errors.py and main.py stay out on purpose: they are declarations
# and wiring, where nearly every mutant is either rejected by pydantic at import or equivalent.
# `also_copy` puts the rest of the package next to the mutated files in mutants/src, so imports of
# the unmutated modules still resolve.
[tool.mutmut]
paths_to_mutate = [
    "src/kathara_api/services/kathara_service.py",
    "src/kathara_api/services/lab_builder.py",
    "src/kathara_api/services/lab_conf_edit.py",
    "src/kathara_api/services/known_labs.py",
    "src/kathara_api/services/lab_import.py",
    "src/kathara_api/services/lab_store.py",
    "src/kathara_api/services/lab_watch.py",
    "src/kathara_api/dependencies.py",
    "src/kathara_api/routers/",
]
tests_dir = ["tests/unit"]
also_copy = ["src/kathara_api"]
# The drift guard deselected here checks that every per-lab method of KatharaService has a test;
# mutmut adds each method's mutated copies to the class under new names, which it then reports as
# untested methods.
pytest_add_cli_args = [
    "--deselect", "tests/unit/test_unknown_lab_coverage.py::test_every_lab_lookup_method_is_covered",
    "-m", "not docker and not network",
    "-p", "no:cacheprovider",
    "-q",
]
