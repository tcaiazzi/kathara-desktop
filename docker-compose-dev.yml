# Hot-reload local stack: backend runs uvicorn --reload against a bind-mounted ./src, frontend
# runs the plain Vite dev server. No reverse-proxy — the Vite dev server's own /api proxy
# (vite.config.ts) plays that role, exactly like running both directly on the host (see
# README's "Running" section); this just containerizes that same flow.
#
# Usage:
#   docker compose -f docker-compose-dev.yml up --build
#   -> http://localhost:5173/   (frontend, proxies /api to the backend container)
#   -> http://localhost:8000/   (backend directly, if needed)
services:
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile.dev
    # Kathara derives each device's container name from the host's hostname (see
    # Kathara.utils.get_current_user_name) to tell "my own" previously-deployed devices apart from
    # other users'. Without a pinned hostname, Docker assigns this container a fresh random one on
    # every recreate, so a backend restart makes Kathara "forget" every device it deployed before
    # that restart — they keep running (still holding their ports) but are no longer recognized as
    # already deployed, so the next deploy tries to create a duplicate and collides on static ports.
    hostname: kathara-ide-backend
    volumes:
      - ./src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind-mounted at the *same absolute path* on both sides, not a named volume: the backend
      # deploys devices as sibling containers over the host's own Docker socket
      # (Docker-outside-of-Docker), so when Kathara bind-mounts a lab's `shared/` folder into a
      # device (native `shared_mount` option — see lab_builder.build_lab), that mount is resolved
      # by the *host* daemon using the path exactly as this container computed it. A named volume's
      # in-container path has no host-side equivalent the host daemon could resolve; mirroring
      # `${PWD}/data/labs` on both sides means the path this container sees is already valid on the
      # host too. Assumes `docker compose` is invoked from the repo root (as documented below).
      - ${PWD}/data/labs:${PWD}/data/labs
    environment:
      - KATHARA_API_LABS_DIR=${PWD}/data/labs
      # The browser page is served by Vite on :5173, and Vite's proxy forwards the browser's own
      # Origin verbatim on a WebSocket upgrade (changeOrigin rewrites Host only), so the backend
      # sees Origin: http://localhost:5173 against Host: backend:8000. Without this the device
      # terminal's handshake — and every state-changing request — would be refused as
      # cross-origin. See dependencies.is_origin_allowed.
      - KATHARA_API_CORS_ORIGINS=http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./services/frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
