# Serves the built SPA. react-router uses client-side routing, so any path that isn't a real
# static asset falls back to index.html. This container is only ever reached through the
# reverse-proxy (see services/reverse-proxy/nginx.conf) — it doesn't need to know about /api.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
