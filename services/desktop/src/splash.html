<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kathara Desktop</title>
    <style>
      /* Fixed white, not the OS scheme like setup.html: the logo is a dark mark on a transparent
         background, so it needs a deliberately light canvas rather than whatever the user's
         theme happens to be. */
      html, body {
        margin: 0; height: 100%;
        background: #ffffff;
      }
      body {
        display: flex; align-items: center; justify-content: center;
      }
      img {
        max-width: 60%; max-height: 60%;
      }
    </style>
  </head>
  <body>
    <img src="splash.png" alt="" />
  </body>
</html>
