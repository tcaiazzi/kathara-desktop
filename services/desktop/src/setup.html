<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kathara Desktop</title>
    <style>
      /* Follows the OS scheme rather than being dark-only. This page is the first thing the app
         paints, and the SPA it hands over to defaults to the OS preference too (see
         services/frontend/index.html and src/hooks/useTheme.ts) — a fixed dark palette here made
         every light-theme launch open with a dark flash. Values mirror Bootstrap 5's light and
         dark defaults, which is what the SPA is themed with. */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #212529;
        --muted: #6c757d;
        --border: #dee2e6;
        --ok: #198754;
        --bad: #dc3545;
        --warn: #997404;
        --link: #0d6efd;
        --btn-bg: #f8f9fa;
        --btn-border: #ced4da;
        --primary: #0d6efd;
        --primary-fg: #ffffff;
        --pre-bg: #f8f9fa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #e6e6e6;
          --muted: #9aa0a6;
          --border: #2f2f2f;
          --ok: #4caf7d;
          --bad: #e5686b;
          --warn: #d8b563;
          --link: #6ea8fe;
          --btn-bg: #2b2b2b;
          --btn-border: #3d3d3d;
          --primary: #2f6feb;
          --primary-fg: #ffffff;
          --pre-bg: #161616;
        }
      }
      body {
        margin: 0; padding: 2.5rem clamp(1.5rem, 6vw, 4rem);
        background: var(--bg); color: var(--fg);
        font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 1.35rem; margin: 0 0 .35rem; font-weight: 600; }
      .sub { color: var(--muted); margin: 0 0 1.75rem; }
      ul { list-style: none; padding: 0; margin: 0 0 1.75rem; }
      li { display: grid; grid-template-columns: 1.4rem 1fr; gap: .65rem;
           padding: .7rem 0; border-bottom: 1px solid var(--border); }
      .mark { font-weight: 700; }
      .ok .mark { color: var(--ok); }
      .bad .mark { color: var(--bad); }
      .name { font-weight: 600; }
      .detail { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: .82rem; word-break: break-word; }
      .remedy { margin-top: .3rem; color: var(--warn); }
      a { color: var(--link); }
      .actions { display: flex; gap: .6rem; flex-wrap: wrap; }
      button {
        font: inherit; padding: .5rem 1rem; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--fg);
      }
      button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
      button:hover { filter: brightness(1.15); }
      pre { background: var(--pre-bg); border: 1px solid var(--border); border-radius: 6px;
            padding: .8rem; overflow: auto; max-height: 15rem; font-size: .78rem; }
      .spinner { display: inline-block; width: .85rem; height: .85rem; border-radius: 50%;
                 border: 2px solid var(--btn-border); border-top-color: var(--link);
                 animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .ladder { list-style: none; padding: 0; margin: 0 0 1.25rem; }
      .ladder li { display: flex; align-items: center; gap: .55rem; padding: .3rem 0; }
      .ladder .mark { display: inline-flex; width: 1.1rem; justify-content: center; font-weight: 700; }
      .ladder-done { color: var(--ok); }
      .ladder-done .mark { color: var(--ok); }
      .ladder-current { color: var(--fg); font-weight: 600; }
      .ladder-pending { color: var(--muted); }
      details { margin: 0 0 1rem; }
      details summary { cursor: pointer; color: var(--muted); }
      details pre { margin-top: .5rem; }
      .callout {
        display: flex; gap: .9rem; align-items: flex-start;
        border: 1px solid var(--warn); border-radius: 8px;
        padding: 1rem 1.15rem; margin: 0 0 1.5rem;
        background: color-mix(in srgb, var(--warn) 12%, transparent);
      }
      .callout .icon { font-size: 1.6rem; line-height: 1; }
      .callout h2 { margin: 0 0 .3rem; font-size: 1.05rem; }
      .callout p { margin: 0; color: var(--fg); }
    </style>
  </head>
  <body>
    <main id="app"><p class="sub"><span class="spinner"></span> Starting…</p></main>
    <script>
      const app = document.getElementById("app");
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      // KEEP IN SYNC with the BootPhase union in main.ts. Order matters: it's the ladder below.
      const MAIN_PHASES = ["environment", "frontend", "docker", "python", "backend"];
      const INSTALL_PHASES = ["install-prepare", "install-pip", "install-wheel"];
      const PHASE_LABEL = {
        environment: "Reading your shell environment",
        frontend: "Preparing the interface",
        docker: "Contacting Docker",
        python: "Looking for Python and the Kathara packages",
        backend: "Starting the local Kathara API",
        "install-prepare": "Preparing the Python environment",
        "install-pip": "Updating pip",
        "install-wheel": "Installing Kathara and the Kathara API",
      };

      // Phase-specific reassurance once a step has been running a while, so a slow step reads as
      // "still working" instead of "stuck". Purely client-side: computed from status.startedAt,
      // which is set once per boot attempt and doesn't change between polls.
      const PATIENCE_HINTS = [
        { phase: "docker", afterSec: 6, text: "Docker is taking a while to answer. If you just started Docker Desktop, it may still be warming up." },
        { phase: "python", afterSec: 8, text: "Still checking the Python interpreters on this machine." },
        { phase: "backend", afterSec: 12, text: "The first start is the slowest one — Python is loading Kathara." },
        { phase: "install-wheel", afterSec: 30, text: "Still downloading. You can leave this running; the output below updates as it goes." },
      ];

      function ladderHtml(phase) {
        const phases = INSTALL_PHASES.includes(phase) ? INSTALL_PHASES : MAIN_PHASES;
        const currentIdx = phases.indexOf(phase);
        const items = phases.map((id, i) => {
          const state = i < currentIdx ? "done" : i === currentIdx ? "current" : "pending";
          const mark = state === "done" ? "✓" : state === "current" ? '<span class="spinner"></span>' : "·";
          return `<li class="ladder-${state}"><span class="mark">${mark}</span> ${esc(PHASE_LABEL[id])}…</li>`;
        }).join("");
        return `<ul class="ladder">${items}</ul>`;
      }

      // The checks list grows incrementally as runPreflight decides each one (see prereqs.ts's
      // onProgress) — this is the same rendering used later on the failure screens, so a check
      // that appears while still "starting" looks exactly like it will if the run ends up failing.
      function checksHtml(checks) {
        if (!checks || checks.length === 0) return "";
        const items = checks.map((c) => `
          <li class="${c.ok ? "ok" : "bad"}">
            <span class="mark">${c.ok ? "✓" : "✕"}</span>
            <div>
              <div class="name">${esc(c.label)}</div>
              <div class="detail">${esc(c.detail)}</div>
              ${c.remedy ? `<div class="remedy">${esc(c.remedy)}${
                c.docsUrl ? ` <a href="#" data-url="${esc(c.docsUrl)}">Learn more</a>` : ""
              }</div>` : ""}
            </div>
          </li>`).join("");
        return `<ul>${items}</ul>`;
      }

      // Once packages install themselves automatically (see main.ts's Docker-exempt auto-install
      // gate), Docker being the *only* thing still failing is the common case, not an edge case —
      // it's the one prerequisite the app can never satisfy for the user. A muted `.remedy` line
      // buried in the checklist, the same weight as every other check, undersells that. This is
      // additive to checksHtml() above, not a replacement: the checklist still lists Docker (and
      // its own remedy text) normally underneath, for anyone who scrolls past the callout.
      function dockerCallout(checks) {
        const failing = checks.filter((c) => !c.ok);
        if (failing.length !== 1 || failing[0].id !== "docker") return "";
        const platform = window.katharaDesktop.platform;
        const product = platform === "darwin" || platform === "win32" ? "Docker Desktop" : "Docker Engine";
        return `
          <div class="callout">
            <span class="icon">🐳</span>
            <div>
              <h2>Start ${esc(product)}</h2>
              <p>${esc(failing[0].remedy ?? failing[0].detail)}</p>
            </div>
          </div>`;
      }

      function renderStarting(status) {
        const elapsedSec = Math.max(0, Math.round((Date.now() - status.startedAt) / 1000));
        const hint = PATIENCE_HINTS.find((h) => h.phase === status.phase && elapsedSec >= h.afterSec);

        const heading = status.firstRun ? "Welcome to Kathara Desktop" : "Starting Kathara Desktop";
        const lead = status.firstRun
          ? "Kathara Desktop doesn't bundle its own network emulator — it drives Docker, which must " +
            "already be installed and running on this computer. The Kathara Python packages it " +
            "needs are installed automatically, into a Python environment bundled with the app. " +
            "Checking that everything is in place…"
          : esc(status.message) || "Getting the local Kathara API ready…";

        app.innerHTML = `
          <h1>${heading}</h1>
          <p class="sub">${lead}</p>
          ${ladderHtml(status.phase)}
          ${elapsedSec >= 5 ? `<p class="sub">Working on it — ${elapsedSec}s</p>` : ""}
          ${hint ? `<p class="sub">${esc(hint.text)}</p>` : ""}
          ${checksHtml(status.checks)}
          ${status.output ? `<pre>${esc(status.output)}</pre>` : ""}`;

        app.querySelectorAll("a[data-url]").forEach((a) => {
          a.onclick = (e) => { e.preventDefault(); window.katharaDesktop.openExternal(a.dataset.url); };
        });
      }

      function renderChecks(status) {
        const failed = status.state === "prereq-failed";

        // "Install missing packages" only helps with these, and only when Docker (which the app
        // deliberately doesn't touch — prereqs.ts) isn't also the problem: matches main.ts's own
        // auto-install gate, which ignores Docker for the same reason (installing the wheel needs
        // nothing from it) but still won't run when something else it can't fix is failing too.
        // "dependencies" is in the list because a fresh venv built from the bundled wheel resolves
        // whatever the current interpreter's environment is missing.
        const installable = ["kathara_api", "kathara", "uvicorn", "dependencies"];
        const nonDocker = status.checks.filter((c) => c.id !== "docker");
        const canAutoInstall =
          nonDocker.some((c) => !c.ok) && nonDocker.every((c) => c.ok || installable.includes(c.id));

        app.innerHTML = `
          <h1>${failed ? "A few things are missing" : "Kathara Desktop couldn't start its local API"}</h1>
          <p class="sub">${failed
            ? "Kathara Desktop installs the Python packages it needs by itself, but it can't install " +
              "or start Docker for you — that has to already be installed and running on this " +
              "computer. Sort out anything marked ✕ below, then choose “Check again”."
            : "Everything it needs is installed, but the API process didn't come up. The " +
              "technical details below usually say why."}</p>
          ${failed && status.notice ? `<p class="sub">${esc(status.notice)}</p>` : ""}
          ${failed ? dockerCallout(status.checks) : ""}
          ${checksHtml(status.checks)}
          ${!failed && status.error ? `<p class="sub">${esc(status.error)}</p>` : ""}
          ${status.logTail ? `<details><summary>Technical details</summary><pre>${esc(status.logTail)}</pre></details>` : ""}
          <div class="actions">
            ${canAutoInstall ? '<button class="primary" id="install">Install missing packages</button>' : ""}
            <button class="${canAutoInstall ? "" : "primary"}" id="retry">Check again</button>
            <button id="pick">Choose Python interpreter…</button>
            <button id="log">Open log</button>
          </div>`;

        if (canAutoInstall) {
          // Fire-and-poll, not await-then-poll: install can take several minutes, and the whole
          // point of threading progress through status:install (see main.ts) is to watch it live
          // rather than stare at one static line until the awaited call finally resolves.
          document.getElementById("install").onclick = () => {
            const done = window.katharaDesktop.install();
            refresh();
            done.catch(() => {});
          };
        }
        document.getElementById("retry").onclick = () => {
          const done = window.katharaDesktop.retryStartup();
          refresh();
          done.catch(() => {});
        };
        document.getElementById("pick").onclick = async () => {
          // Picking an interpreter is quick and has its own dialog, so awaiting just that part
          // (not the recheck it triggers) is fine.
          if (await window.katharaDesktop.pickPython()) {
            const done = window.katharaDesktop.retryStartup();
            refresh();
            done.catch(() => {});
          } else {
            refresh();
          }
        };
        document.getElementById("log").onclick = () => window.katharaDesktop.showBackendLog();
        app.querySelectorAll("a[data-url]").forEach((a) => {
          a.onclick = (e) => { e.preventDefault(); window.katharaDesktop.openExternal(a.dataset.url); };
        });
      }

      async function refresh() {
        const status = await window.katharaDesktop.getStatus();
        if (status.state === "starting") {
          renderStarting(status);
          // The shell navigates away once the backend is healthy, so polling only continues
          // while this page is still the one on screen.
          setTimeout(refresh, 500);
        } else {
          renderChecks(status);
        }
      }

      refresh();
    </script>
  </body>
</html>
