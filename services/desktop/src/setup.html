<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Everything this page runs and draws is a file next to it (build.mjs copies them): no
         inline script or style, so nothing injected into it could run. The shell's bridge
         (window.katharaDesktop) comes from the preload script, which no policy applies to. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'" />
    <title>Kathara Desktop</title>
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main id="app"><p class="sub"><span class="spinner"></span> Starting…</p></main>
    <script src="setup.js"></script>
  </body>
</html>
