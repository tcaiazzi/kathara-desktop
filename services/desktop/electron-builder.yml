appId: org.kathara.desktop
productName: Kathara-Desktop
copyright: Kathara Framework

directories:
  output: release
  buildResources: resources

# Only the built shell needs to ship; src/ and the toolchain do not.
files:
  - build/**/*
  - package.json

# The SPA the backend serves at runtime (KATHARA_API_STATIC_DIR points here — see
# src/paths.ts). Built by `npm run build:frontend`, which `npm run dist` runs first.
extraResources:
  - from: ../frontend/dist
    to: frontend
  # Also shipped as a plain file because BrowserWindow's `icon` option needs a real path at
  # runtime — the icon electron-builder bakes into the installer isn't reachable from code.
  - from: resources/icon.png
    to: icon.png
  # kathara-api-rest's own wheel (built by CI just before this — see build-desktop.yml — into
  # this gitignored directory), so a packaged app can `pip install` it into a private venv
  # without needing a git checkout. Pure Python, one wheel works on every OS/arch. Excludes the
  # python-<os>-<arch>/ subdirectories fetch-python.mjs also puts in this same gitignored vendor/
  # directory: those are picked up separately, one arch at a time, by the platform-scoped
  # extraResources below — copying them here too would ship every architecture's interpreter in
  # every installer, exactly what that per-arch scoping exists to avoid.
  - from: vendor
    to: vendor
    filter: ["**/*", "!python-*", "!python-*/**"]

# kathara://lab/<name> — the runtime side is in src/deeplink.ts.
protocols:
  - name: Kathara-Desktop
    schemes: [kathara]

# See scripts/sign-mac-arm64.js: ad-hoc signs the arm64 .app before packaging. Only macOS/arm64
# does anything here — a no-op on every other build.
afterPack: scripts/sign-mac-arm64.js

linux:
  # Primary target: Docker runs natively, no VM in between.
  # AppImage covers every distro; deb/rpm give apt- and dnf-based distros a native
  # package. All three build for x64 and arm64 (no native node modules to rebuild,
  # so this cross-builds fine from the x64 CI runner).
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  category: Development
  synopsis: Desktop app for the Kathara network emulation framework
  icon: resources/icon.png
  # The interpreter bundled for *this* build's arch only (fetched by scripts/fetch-python.mjs into
  # vendor/python-linux-<arch>/ — see paths.ts's bundledPythonPath()). ${arch} is expanded by
  # electron-builder per packaged target, so an x64 install never carries the arm64 interpreter
  # (or vice versa) — shipping both would double the size this exists to bound.
  extraResources:
    - from: vendor/python-linux-${arch}
      to: python

deb:
  # Required by fpm; taken from package.json's author, stated here so it is obvious where to
  # change it when the project has a dedicated packaging address.
  maintainer: Kathara Framework <tommaso@kathara.org>
  # Docker is still a soft recommendation (apt can't see whether Docker is actually running, and
  # `docker.io` isn't the only way to get it — see src/prereqs.ts's checkDocker()). Python is no
  # longer listed: the app bundles its own interpreter (paths.ts's bundledPythonPath()) and never
  # requires a system one.
  recommends: [docker.io]

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: resources/icon.png
  # Unsigned and un-notarized: hardenedRuntime buys nothing without a signature, and enabling it
  # makes the app harder to launch. `identity: null` skips *all* signing here, including the
  # ad-hoc one Apple Silicon requires just to launch an app at all (Intel only needs Gatekeeper's
  # "unidentified developer" bypassed, e.g. right-click → Open) — scripts/sign-mac-arm64.js
  # applies that ad-hoc signature separately for the arm64 build, afterPack — including, now, the
  # bundled Python interpreter below, which needs the same per-binary ad-hoc signature to exec at
  # all on Apple Silicon. First run still needs
  # `xattr -dr com.apple.quarantine "/Applications/Kathara-Desktop.app"` (or right-click → Open) either
  # way, since none of this is a real Developer ID signature.
  hardenedRuntime: false
  identity: null
  extraResources:
    - from: vendor/python-mac-${arch}
      to: python

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: resources/icon.png
  # Deliberately unsigned — no code-signing certificate. SmartScreen will warn on first run
  # ("More info" → "Run anyway"). Docker Desktop with the WSL2 backend is a prerequisite.
  extraResources:
    - from: vendor/python-win-${arch}
      to: python

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # electron-builder's own NSIS default is "${productName} Setup ${version}.${ext}" — a literal
  # space before "Setup" regardless of productName's own formatting. Override it so every OS
  # produces a space-free artifact filename, matching the hyphenated default template
  # ("${productName}-${version}-${arch}.${ext}") every other target already uses.
  artifactName: "${productName}-Setup-${version}.${ext}"

# No autoUpdater: it is unreliable on unsigned Windows and macOS builds. Releases are published
# and installed manually.
publish: null
