# Fronts both the React frontend and the FastAPI backend on one origin, so the browser never
# needs CORS (see docs/refactor-plan.md, Track 2) — the frontend's relative `/api/...` calls
# resolve back to this same host. The interactive API docs stay reachable through the proxy.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # exec/stream and stats/stream are Server-Sent Events: buffering would delay/batch
        # chunks instead of forwarding them as they arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
